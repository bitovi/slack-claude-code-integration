# Test, build, and deploy.
#
# Build/push/write-back mechanics live in a shared workflow in
# bitovi/platform-ci, pinned to an exact tag. This file owns the triggers,
# this repo's tests, and the app-specific inputs.
#
#   push vX.Y.Z -> build a tagged image, point PRODUCTION at it
#
# Single environment: this is an internal onboarding tool with no staging
# counterpart, so there is no build-then-promote split — tags build and deploy
# directly. deploy/production/values.yaml owns the shared tier (ECR repository,
# CI push role, secret push-back).
name: Test, build, and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI's own write-back commit (`chore(release): deploy <sha>`) must not
  # re-enter this workflow — it changes one image tag, so the code is identical
  # to what was just tested. Scoped to branch pushes: a release tag often points
  # at a write-back commit, and skipping those would break releasing.
  test:
    if: github.ref_type != 'branch' || !contains(github.event.head_commit.message, '[deploy-writeback]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      # Smoke test: the app must boot and answer /health. Guards the two most
      # likely breakages — a syntax error, or the startup env guard rejecting
      # something — without needing a full test suite.
      - name: Smoke test
        env:
          SLACK_CLIENT_ID: test.id
          SLACK_CLIENT_SECRET: test-secret
          SLACK_STATE_SECRET: test-state-secret
          SLACK_OAUTH_REDIRECT_URL: https://example.test/oauth/callback
          SLACK_USER_SCOPES: chat:write
        run: |
          node server.js &
          PID=$!
          sleep 2
          curl -sf --max-time 5 localhost:3000/health
          curl -sf --max-time 5 -o /dev/null localhost:3000/
          kill $PID

  # Merges to main are tested but not deployed. Releasing is an explicit
  # `git tag vX.Y.Z && git push origin vX.Y.Z`.
  production:
    if: github.ref_type == 'tag'
    needs: [test]
    uses: bitovi/platform-ci/.github/workflows/container-build.yml@0.0.1
    # A called workflow can only narrow permissions, so the caller grants them.
    permissions:
      id-token: write
      contents: write
      actions: write
    with:
      values-file: deploy/production/values.yaml
      image-tag-path: .workloads.main.image.tag
      environment-label: release
      writeback-app-id: ${{ vars.CI_WRITEBACK_APP_ID }}
    secrets: inherit
